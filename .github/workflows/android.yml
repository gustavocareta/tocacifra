name: Gerar o aplicativo Android (APK)

# Monta o APK do TocaCifra (a pasta public/ dentro de um app Android, com Capacitor) e publica em
#   https://github.com/gustavocareta/tocacifra/releases/tag/android-latest
# Roda sozinho quando o site muda (public/) e pode ser rodado a mao em Actions > "Gerar o aplicativo Android (APK)".
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
      - 'scripts/android-prepare.mjs'
  # a cada 3 dias: usar o cache da chave de assinatura o mantem vivo (o GitHub apaga caches parados por 7 dias)
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # o runner ja traz o Android SDK; aqui so aceitamos as licencas e garantimos a versao usada pelo Capacitor 8
      - name: Preparar o Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Instalar dependencias
        run: npm ci

      - name: Criar o projeto Android (nao fica no repositorio; e gerado a cada vez)
        run: npx cap add android

      - name: Instalar o ImageMagick (para redimensionar os icones)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      # a chave de assinatura precisa ser SEMPRE a mesma: so assim o Android aceita instalar o APK novo por cima do antigo
      - name: Chave de assinatura (cache)
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/tocacifra-keystore
          key: tocacifra-keystore-v2

      - name: Criar a chave de assinatura (so na primeira vez)
        run: |
          mkdir -p ~/tocacifra-keystore
          if [ ! -f ~/tocacifra-keystore/tocacifra.keystore ]; then
            keytool -genkeypair -v -keystore ~/tocacifra-keystore/tocacifra.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=TocaCifra,O=TocaCifra,C=BR"
          fi
          echo "TC_KEYSTORE=$HOME/tocacifra-keystore/tocacifra.keystore" >> "$GITHUB_ENV"

      - name: Permissoes e icone do app
        run: node scripts/android-prepare.mjs

      # a versao fica dentro do app (version.json) e nas notas da release; o app compara as duas para avisar de atualizacao
      - name: Marcar a versao do app
        run: echo "{\"sha\":\"${GITHUB_SHA}\"}" > public/version.json

      - name: Copiar o site para dentro do app
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TocaCifra-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar na pagina de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk TocaCifra.apk
          gh release delete android-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create android-latest TocaCifra.apk \
            --title "TocaCifra para Android" \
            --notes "Aplicativo Android (APK) do TocaCifra, gerado automaticamente. Baixe o arquivo TocaCifra.apk no celular e instale (permita 'instalar apps desconhecidos' para o navegador). Se ja tiver uma versao instalada, instale por cima; se o Android recusar, desinstale a antiga antes. Seus dados ficam na sua conta. [build:${GITHUB_SHA}]" \
            --latest=false
