name: Manter o Supabase ativo

# O plano gratis do Supabase pausa projetos sem uso por 1 semana. Este aviso (um "ping" inofensivo)
# roda a cada 3 dias e evita a pausa. Usa so a chave PUBLICA que ja esta em public/config.js.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/config.js
          sparse-checkout-cone-mode: false
      - name: Ping no Supabase
        run: |
          URL=$(grep -oP "supabaseUrl: '\K[^']+" public/config.js)
          KEY=$(grep -oP "supabaseAnonKey: '\K[^']+" public/config.js)
          test -n "$URL" && test -n "$KEY"
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
